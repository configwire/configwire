# Release: download-and-run (prebuilt ghcr.io image, no build, no source needed).
# Pull-only usage (no source needed, just this file):
#   curl -O https://raw.githubusercontent.com/configwire/configwire/main/docker-compose.yml
#   docker compose pull && docker compose up -d
#   curl -s http://localhost:8090/healthz
#   curl -s http://localhost:8090/healthz | grep -q '"status":"ok"'
# Local dev (build from this checkout, run from this dir):
#   docker compose -f docker-compose-dev.yml up -d --build
# First superuser, two paths (pick one):
#   a) Env auto-bootstrap (fresh instance only): set CONFIGWIRE_ADMIN_EMAIL
#      and CONFIGWIRE_ADMIN_PASSWORD in the shell or a .env file before
#      `up -d`; the server creates the first superuser on first boot.
#      Empty (default) keeps the first-run setup screen at /.
#   b) Manual upsert on a running container:
#      docker compose exec configwire ./configwire superuser upsert admin@example.com <change-me-32-chars> --dir /app/pb_data
# Monorepo usage (run from repo root):
#   docker compose -f configwire/docker-compose.yml up -d
name: configwire
services:
  configwire:
    image: ghcr.io/configwire/configwire:latest
    container_name: configwire
    ports:
      - "8090:8090"
    environment:
      - CONFIGWIRE_ADMIN_EMAIL=${CONFIGWIRE_ADMIN_EMAIL:-}
      - CONFIGWIRE_ADMIN_PASSWORD=${CONFIGWIRE_ADMIN_PASSWORD:-}
    volumes:
      - cw-data:/app/pb_data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8090/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  cw-data:
