name: docker-publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Lint
        run: make lint

      - name: Test
        run: make test

  # Build a native image first so we can actually run it before publishing.
  smoke-test:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: configwire:smoke-test
          cache-from: type=gha,scope=docker-publish
          # cache-to removed to prevent overwriting the final multi-arch cache

      - name: Smoke test image
        run: |
          docker run --rm configwire:smoke-test --help

  publish:
    needs: smoke-test
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # latest is controlled explicitly below.
          flavor: |
            latest=false
          tags: |
            # Always publish the exact Git tag.
            type=ref,event=tag

            # Also publish the version without the "v" prefix.
            type=semver,pattern={{version}}

            # Only stable versions update latest.
            # v1.2.3      -> latest
            # v1.2.3-rc.1 -> no latest
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

            # Immutable source identifier.
            type=sha,format=long

          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}

      - name: Build and publish multi-arch image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true

          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

          cache-from: type=gha,scope=docker-publish
          cache-to: type=gha,mode=max,scope=docker-publish

          # Supply-chain metadata.
          provenance: mode=max
          sbom: true
