name: configwire-image

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # make lint already runs gofmt + go vet, so the test step below
      # skips the duplicate build/vet from `make test` (go test compiles anyway).
      - name: Lint
        run: make lint

      - name: Test
        run: go test ./...

  # Native per-arch builds on native runners: no QEMU emulation.
  # Each job pushes an untagged digest (invisible until merged) and
  # smoke-tests that digest, so a broken arch never gets a tag.
  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          # Release images strip the PocketBase dashboard at /_/. Override
          # with --build-arg GO_TAGS= to ship it.
          build-args: GO_TAGS=no_ui
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

          # Per-arch cache scope: amd64/arm64 layers must not share entries.
          cache-from: type=gha,scope=configwire-image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=configwire-image-${{ matrix.arch }}

          # Supply-chain metadata.
          provenance: mode=max
          sbom: true

      - name: Scan image for HIGH/CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke test pushed digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${DIGEST}"
          # The image starts as root so the entrypoint can chown a legacy
          # root-owned volume, then drops to 10001 via su-exec. Assert the
          # effective runtime UID (through the entrypoint), not the image
          # default USER, so --entrypoint must NOT bypass entrypoint.sh here.
          UID_OUT=$(docker run --rm "$REF" id -u)
          if [ "$UID_OUT" != "10001" ]; then
            echo "expected uid 10001, got '$UID_OUT'" >&2
            exit 1
          fi

          docker volume create configwire-smoke-data >/dev/null
          docker run -d --name configwire-smoke \
            --read-only --tmpfs /tmp --cap-drop ALL \
            --cap-add CHOWN --cap-add SETGID --cap-add SETUID \
            --security-opt no-new-privileges \
            -v configwire-smoke-data:/app/pb_data \
            -p 8090:8090 "$REF"
          cleanup() {
            docker rm -f configwire-smoke >/dev/null 2>&1 || true
            docker volume rm configwire-smoke-data >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8090/healthz >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          healthz=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8090/healthz)
          root=$(curl -s -o /tmp/configwire-root.html -w '%{http_code}' http://localhost:8090/)
          dashboard=$(curl -s -o /tmp/configwire-dash.html -w '%{http_code}' http://localhost:8090/_/)
          echo "healthz=$healthz root=$root /_/=$dashboard"
          if [ "$healthz" != "200" ] || [ "$root" != "200" ]; then
            docker logs configwire-smoke 2>&1 | head -50
            exit 1
          fi
          APP_UID=$(docker exec configwire-smoke id -u)
          if [ "$APP_UID" != "10001" ]; then
            echo "expected runtime uid 10001, got '$APP_UID'" >&2
            exit 1
          fi
          if ! grep -q 'ConfigWire Admin' /tmp/configwire-root.html; then
            echo "admin UI missing from / response" >&2
            exit 1
          fi
          if grep -q '<title>PocketBase</title>' /tmp/configwire-dash.html; then
            echo "PocketBase dashboard is still served at /_/" >&2
            exit 1
          fi
          if ! grep -q 'ConfigWire Admin' /tmp/configwire-dash.html; then
            echo "unexpected /_/ response: expected the ConfigWire SPA shell" >&2
            exit 1
          fi

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          pattern: digests-*
          path: /tmp/digests
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Derive floating RC tag
        id: float
        run: |
          ref="${GITHUB_REF_NAME:-}"
          tag=""
          case "$ref" in
            v[0-9]*.[0-9]*.[0-9]*-rc.[0-9]*)
              if printf '%s' "$ref" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$'; then
                tag="${ref%-rc.*}-rc"
              fi
              ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # latest is controlled explicitly below.
          flavor: |
            latest=false
          tags: |
            # Always publish the exact Git tag.
            type=ref,event=tag

            # Also publish the version without the "v" prefix.
            type=semver,pattern={{version}}

            # Floating minor tracks the latest stable patch, so pushing
            # v0.1.2 also moves v0.1 to it. Stable only: partial patterns
            # expand to the full string on pre-releases.
            type=semver,pattern=v{{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}

            # Floating rc tracks the latest release candidate, so pushing
            # v0.2.0-rc.7 also moves v0.2.0-rc to it. Prerelease only:
            # without the guard a stable v0.2.0 would also claim v0.2.0-rc.
            # NOTE: docker/metadata-action semver patterns are a no-op on
            # prereleases (only {{version}}/{{raw}} extend), so the float
            # comes from steps.float as a raw tag instead.
            type=raw,value=${{ steps.float.outputs.tag }},enable=${{ steps.float.outputs.tag != '' }}

            # Only stable versions update latest.
            # v1.2.3      -> latest
            # v1.2.3-rc.1 -> no latest
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

            # Immutable source identifier.
            type=sha,format=long

          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        env:
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta.outputs.json }}
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Sign merged manifest (keyless)
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          DIGEST=$(docker buildx imagetools inspect "$IMAGE:${{ github.ref_name }}" \
            --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "signing $IMAGE@$DIGEST"
          cosign sign --yes "$IMAGE@$DIGEST"

      - name: Smoke test merged tag
        run: |
          docker run --rm ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }} ./configwire --help
