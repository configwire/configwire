# Pull-only usage (no source needed, just this file):
#   curl -O https://raw.githubusercontent.com/configwire/configwire/main/compose.yml
#   docker compose pull && docker compose up -d
#   curl -s http://localhost:8090/hello
# Local dev (run from configwire/):
#   docker compose up --build -d
# First superuser (same flags as README quickstart):
#   docker compose exec configwire ./configwire superuser upsert admin@example.com password123 --dir /app/pb_data
# Monorepo usage (run from repo root):
#   docker compose -f configwire/compose.yml up --build -d
services:
  configwire:
    image: ghcr.io/configwire/configwire:latest
    build: .
    ports:
      - "8090:8090"
    volumes:
      - cw-data:/app/pb_data
    restart: unless-stopped

volumes:
  cw-data:
